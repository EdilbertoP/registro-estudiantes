<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Configuración (llave pública de reCAPTCHA y URL del Web Service) -->
  <script src="js/config.js"></script>
  <!-- Google reCAPTCHA v2 (checkbox "No soy un robot") -->
  <script src="https://www.google.com/recaptcha/api.js?hl=es" async defer></script>
</head>
<body>
  <header class="topbar">
    <h1>Universidad · Registro de Estudiantes</h1>
    <nav>
      <a href="index.html" class="activo">Registro</a>
      <a href="consulta.html">Consulta</a>
    </nav>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2>Formulario de registro</h2>
      <p class="ayuda">Todos los campos son obligatorios.</p>

      <form id="formRegistro" novalidate>
        <div class="grid">
          <div class="campo">
            <label for="carne">Carné</label>
            <input type="text" id="carne" name="carne" maxlength="20" placeholder="Ej. 0905202312">
            <small class="error" id="error-carne"></small>
          </div>

          <div class="campo">
            <label for="nombres">Nombres</label>
            <input type="text" id="nombres" name="nombres" maxlength="60" placeholder="Ej. Juan Carlos">
            <small class="error" id="error-nombres"></small>
          </div>

          <div class="campo">
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" maxlength="60" placeholder="Ej. Pérez López">
            <small class="error" id="error-apellidos"></small>
          </div>

          <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" maxlength="100" placeholder="usuario@dominio.com">
            <small class="error" id="error-correo"></small>
          </div>

          <div class="campo">
            <label for="carrera">Carrera</label>
            <select id="carrera" name="carrera">
              <option value="">-- Seleccione una carrera --</option>
              <option value="Ingeniería en Sistemas">Ingeniería en Sistemas</option>
              <option value="Ingeniería Industrial">Ingeniería Industrial</option>
              <option value="Administración de Empresas">Administración de Empresas</option>
              <option value="Contaduría Pública">Contaduría Pública</option>
              <option value="Psicología">Psicología</option>
              <option value="Ingeniería Civil">Ingeniería Civil</option>
            </select>
            <small class="error" id="error-carrera"></small>
          </div>

          <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" maxlength="9" placeholder="5555-5555">
            <small class="error" id="error-telefono"></small>
          </div>

          <div class="campo">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento">
            <small class="error" id="error-fechaNacimiento"></small>
          </div>

          <div class="campo">
            <span class="etiqueta">Género</span>
            <div class="radios">
              <label><input type="radio" name="genero" value="Masculino"> Masculino</label>
              <label><input type="radio" name="genero" value="Femenino"> Femenino</label>
              <label><input type="radio" name="genero" value="Otro"> Otro</label>
            </div>
            <small class="error" id="error-genero"></small>
          </div>
        </div>

        <!-- reCAPTCHA: se renderiza desde js/registro.js con la llave de config.js -->
        <div class="captcha">
          <div id="recaptcha"></div>
          <small class="error" id="error-captcha"></small>
        </div>

        <button type="submit" id="btnEnviar" disabled>Registrar estudiante</button>
        <div id="mensaje" class="mensaje" role="status"></div>
      </form>
    </section>
  </main>

  <script src="js/validaciones.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
